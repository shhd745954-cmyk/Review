<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review & Connect With Us</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #74ebd5, #9face6); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 450px; text-align: center; }
        .logo { width: 80px; height: 80px; background: #f0f0f0; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #333; }
        h2 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        .section-title { font-weight: bold; margin: 20px 0 10px; color: #444; font-size: 16px; text-align: left; }
        
        .ai-box { background: #f9f9f9; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 20px; }
        .keyword-btn { background: #e0e0e0; border: none; padding: 8px 12px; margin: 4px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .keyword-btn.active { background: #007bff; color: white; }
        .output-box { width: 100%; height: 120px; margin-top: 10px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; resize: none; font-size: 13px; background: #fff; line-height: 1.4; }
        
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn i { margin-right: 10px; font-size: 20px; }
        
        .btn-google { background: #4285F4; color: white; }
        .btn-google:hover { background: #357ae8; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #20ba5a; }
        .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
        
        .action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .btn-copy { background: #333; color: white; font-size: 13px; padding: 6px 12px; border-radius: 5px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        .btn-regenerate { background: #007bff; color: white; font-size: 13px; padding: 6px 12px; border-radius: 5px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo"><i class="fa-solid fa-shop"></i></div>
    <h2 id="business-name">Apna Business Name</h2>
    <p>Hamein review karein aur social media par judein!</p>

    <!-- AI Review Generator -->
    <div class="ai-box">
        <div class="section-title" style="margin-top:0;"><i class="fa-solid fa-robot" style="color:#007bff;"></i> Smart AI Review Generator</div>
        <p style="font-size:12px; margin-bottom:10px;">Options chunein (Har baar naya lamba text banega):</p>
        <div id="keywords-container">
            <button class="keyword-btn" onclick="toggleKeyword(this, 'service')">Great Service</button>
            <button class="keyword-btn" onclick="toggleKeyword(this, 'staff')">Friendly Staff</button>
            <button class="keyword-btn" onclick="toggleKeyword(this, 'speed')">Fast Delivery</button>
            <button class="keyword-btn" onclick="toggleKeyword(this, 'quality')">Best Quality</button>
            <button class="keyword-btn" onclick="toggleKeyword(this, 'recommend')">Highly Recommended</button>
        </div>
        <textarea id="review-output" class="output-box" readonly placeholder="Yahan aapka unique AI review automatic generate hoga..."></textarea>
        
        <div class="action-row">
            <button class="btn-regenerate" onclick="generateAIReview()"><i class="fa-solid fa-arrows-rotate"></i> Change Text (Naya Likho)</button>
            <button class="btn-copy" onclick="copyReview()"><i class="fa-regular fa-copy"></i> Copy Text</button>
        </div>
    </div>

    <!-- Links -->
    <div class="section-title"><i class="fa-solid fa-star" style="color:#f4b400;"></i> 1. Copy karke yahan Paste karein</div>
    <a href="#" target="_blank" class="btn btn-google"><i class="fa-brands fa-google"></i> Google Par Review Dein</a>

    <div class="section-title"><i class="fa-solid fa-share-nodes"></i> 2. Hamein Social Media par Follow karein</div>
    <a href="#" target="_blank" class="btn btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp Chat / Share</a>
    <a href="#" target="_blank" class="btn btn-instagram"><i class="fa-brands fa-instagram"></i> Instagram Follow</a>
</div>

<script>
    // ==========================================
    // APNI DETAILS YAHAN BADLEIN
    // ==========================================
    const businessName = "Aapki Dukaan Ka Naam";
    const googleReviewLink = "https://google.com"; 
    const whatsappLink = "https://wa.me!"; 
    const instagramLink = "https://instagram.com"; 

    // Setup Links
    document.getElementById('business-name').innerText = businessName;
    document.querySelector('.btn-google').href = googleReviewLink;
    document.querySelector('.btn-whatsapp').href = whatsappLink;
    document.querySelector('.btn-instagram').href = instagramLink;

    // AI Language Bank - Alag alag tarike se likhne ke liye database
    const reviewDatabase = {
        greetings: [
            `I recently visited ${businessName} and had an absolutely wonderful time.`,
            `My experience with ${businessName} was incredible from start to finish.`,
            `If you are looking for the best place, ${businessName} is highly recommended!`,
            `I am extremely happy with the overall experience at ${businessName}.`
        ],
        service: [
            "The customer service here is exceptional. They really know how to take care of their clients.",
            "Their support team and service management are top-notch and highly professional.",
            "I was amazed by their outstanding service. They are polite, attentive, and very professional."
        ],
        staff: [
            "The staff members are incredibly friendly, humble, and always ready to help with a smile.",
            "The behavior of the staff was very welcoming, cooperative, and polite throughout.",
            "Everyone working here is extremely professional, well-mannered, and genuinely helpful."
        ],
        speed: [
            "What impressed me the most was their lightning-fast response and super quick delivery.",
            "They value time! Everything was executed promptly without any unnecessary delays.",
            "Super efficient process and very fast service. Didn't have to wait at all."
        ],
        quality: [
            "The quality of their work and products is outstanding and totally worth every penny.",
            "They do not compromise on quality. Absolutely premium standard and brilliant execution.",
            "Everything they offer is of superior quality, highly reliable, and genuinely authentic."
        ],
        recommend: [
            "I will definitely visit again and highly recommend them to all my friends and family!",
            "Without a doubt, this is the most reliable business in town. 10/10 recommendation!",
            "If you want genuine and authentic results, look no further. Go for it blindly!"
        ],
        closings: [
            "Keep up the brilliant work guys! ⭐⭐⭐⭐⭐",
            "Highly impressed and satisfied. Five stars all the way! ⭐⭐⭐⭐⭐",
            "A truly delightful experience. Strongly recommended! ⭐⭐⭐⭐⭐"
        ]
    };

    let selectedKeywords = [];

    function toggleKeyword(btn, value) {
        btn.classList.toggle('active');
        if (btn.classList.contains('active')) {
            selectedKeywords.push(value);
        } else {
            selectedKeywords = selectedKeywords.filter(item => item !== value);
        }
        generateAIReview();
    }

    // Array me se random item chunne ka function
    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    // AI Review Generator Engine
    function generateAIReview() {
        const output = document.getElementById('review-output');
        if (selectedKeywords.length === 0) {
            output.value = "";
            return;
        }
        
        let sentences = [];
        
        // 1. Random Greeting add karo
        sentences.push(getRandomItem(reviewDatabase.greetings));
        
        // 2. Jo jo keywords select kiye hain unke random sentences uthao
        selectedKeywords.forEach(key => {
            if (reviewDatabase[key]) {
                sentences.push(getRandomItem(reviewDatabase[key]));
            }
        });
        
        // 3. Random Closing add karo
        sentences.push(getRandomItem(reviewDatabase.closings));
        
        // Final review generate karo aur textarea me daal do
        output.value = sentences.join(" ");
    }

    function copyReview() {
        const output = document.getElementById('review-output');
        if(!output.value) {
            alert("Pehle upar se koi option select karein!");
            return;
        }
        output.select();
        output.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(output.value);
