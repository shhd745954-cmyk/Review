<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Review Card</title>
    <!-- FontAwesome Icons Link -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        
        .review-card { background: #ffffff; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; border: 1px solid #e5e7eb; }
        .biz-icon { width: 70px; height: 70px; background: #eff6ff; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #2563eb; }
        
        h2 { color: #111827; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .sub-text { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
        
        .section-header { font-size: 15px; font-weight: 600; color: #374151; text-align: left; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
        
        /* Star Rating Style */
        .stars-wrapper { display: flex; justify-content: center; gap: 10px; margin: 5px 0 15px; }
        .star-item { font-size: 32px; color: #d1d5db; cursor: pointer; transition: color 0.1s; }
        .star-item.active { color: #f4b400; }

        /* AI Box Style */
        .ai-container { background: #f9fafb; padding: 15px; border-radius: 16px; border: 1px solid #e5e7eb; margin-bottom: 15px; }
        .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .tag-btn { background: #e5e7eb; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 500; color: #374151; transition: 0.2s; }
        .tag-btn.active { background: #2563eb; color: #ffffff; }
        
        .review-box { width: 100%; height: 110px; margin-top: 12px; padding: 12px; border-radius: 10px; border: 1px solid #d1d5db; resize: none; font-size: 13.5px; background: #ffffff; line-height: 1.4; color: #1f2937; }
        
        .ctrl-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .action-mini-btn { font-size: 12.5px; padding: 7px 12px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 500; }
        .btn-regen { background: #2563eb; color: white; }
        .btn-copy { background: #1f2937; color: white; transition: background 0.2s; }
        
        /* Action Links Buttons */
        .main-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 13px; margin: 8px 0; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .main-btn i { margin-right: 10px; font-size: 18px; }
        
        .google-color { background: #4285F4; color: white; }
        .whatsapp-color { background: #25D366; color: white; }
        .instagram-color { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
    </style>
</head>
<body>

    <div class="review-card">
        <div class="biz-icon"><i class="fa-solid fa-store"></i></div>
        <h2 id="display-biz-name">Company Name</h2>
        <p class="sub-text">Rate us and stay connected with our social media!</p>

        <!-- AI REVIEW ENGINE -->
        <div class="ai-container">
            <div class="section-header" style="margin-top:0;"><i class="fa-solid fa-star" style="color:#f4b400;"></i> Select Your Rating</div>
            <!-- 1 to 5 Stars System -->
            <div class="stars-wrapper">
                <i class="fa-solid fa-star star-item" onclick="setRating(1)"></i>
                <i class="fa-solid fa-star star-item" onclick="setRating(2)"></i>
                <i class="fa-solid fa-star star-item" onclick="setRating(3)"></i>
                <i class="fa-solid fa-star star-item" onclick="setRating(4)"></i>
                <i class="fa-solid fa-star star-item" onclick="setRating(5)"></i>
            </div>

            <div class="section-header"><i class="fa-solid fa-robot" style="color:#2563eb;"></i> AI Text Generator</div>
            <p style="font-size:12px; color:#6b7280; margin-bottom:10px; text-align:left;">Select keywords below to customize your experience:</p>
            
            <div class="btn-group">
                <button class="tag-btn" onclick="toggleTag(this, 'service')">Great Service</button>
                <button class="tag-btn" onclick="toggleTag(this, 'staff')">Friendly Staff</button>
                <button class="tag-btn" onclick="toggleTag(this, 'speed')">Fast Delivery</button>
                <button class="tag-btn" onclick="toggleTag(this, 'quality')">Best Quality</button>
                <button class="tag-btn" onclick="toggleTag(this, 'recommend')">Highly Recommended</button>
            </div>
            
            <textarea id="output-text" class="review-box" readonly placeholder="Your automatic unique AI review will generate here..."></textarea>
            
            <div class="ctrl-row">
                <button class="action-mini-btn btn-regen" onclick="generateReview()"><i class="fa-solid fa-arrows-rotate"></i> Change Text</button>
                <button id="copy-btn" class="action-mini-btn btn-copy" onclick="copyToClipboard()"><i class="fa-regular fa-copy"></i> Copy Text</button>
            </div>
        </div>

        <!-- LINK BUTTONS -->
        <div class="section-header"><i class="fa-solid fa-circle-arrow-down" style="color:#16a34a;"></i> Step 1: Copy & Paste Review Here</div>
        <a href="#" id="go-google" target="_blank" class="main-btn google-color"><i class="fa-brands fa-google"></i> Write Review on Google</a>

        <div class="section-header"><i class="fa-solid fa-share-nodes"></i> Step 2: Follow & Connect with Us</div>
        <a href="#" id="go-whatsapp" target="_blank" class="main-btn whatsapp-color"><i class="fa-brands fa-whatsapp"></i> Chat on WhatsApp</a>
        <a href="#" id="go-instagram" target="_blank" class="main-btn instagram-color"><i class="fa-brands fa-instagram"></i> Follow on Instagram</a>
    </div>

<script>
